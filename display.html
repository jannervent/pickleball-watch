<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PB Display</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #ffd700; --bg: #0d1b2a; --a: #1976D2; --b: #D32F2F; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* Waiting state */
    #waiting {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
    }
    .wait-icon { font-size: 56px; }
    .wait-text { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.5); text-align: center; }

    /* Score panels */
    #scoreboard {
      display: none;
      flex-direction: row;
      height: 100%;
      width: 100%;
    }

    .team-panel {
      flex: 1 1 50%;
      width: 50%;
      min-width: 0;
      max-width: 50%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.2s;
      position: relative;
      background: #ffffff;
      border: 10px solid transparent;
    }
    #panelA { border-color: var(--a); }
    #panelB { border-color: var(--b); }
    .team-panel.serving {
      box-shadow: inset 0 0 0 4px var(--gold);
    }

    /* Rally mode: only the score numbers and the mode-tag box are shown */
    #scoreboard.rally .serve-boxes,
    #scoreboard.rally .call-pill {
      display: none;
    }
    #scoreboard.rally .team-panel.serving {
      box-shadow: none;
    }

    .t-score {
      font-size: clamp(120px, 40vw, 320px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
      margin-top: 30px;
      white-space: nowrap;
      min-width: 0;
      flex-shrink: 1;
    }
    .score-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }
    .serve-boxes {
      display: none; /* serve-number cards removed from the display in both modes */
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
    }
    /* Nudge the serve-number cards 40px toward the center divider (unused while hidden above) */
    #panelA .serve-boxes { transform: translateX(40px); }
    #panelB .serve-boxes { transform: translateX(-40px); }
    .team-panel.serving .serve-boxes { opacity: 1; }
    .team-panel:not(.serving) .serve-boxes { opacity: 0.15; }
    .serve-box {
      width: 120px; height: 120px;
      border-radius: 14px;
      border: 4px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-size: 72px; font-weight: 900;
      color: var(--gold);
      opacity: 0.25;
    }
    .serve-box.active {
      opacity: 1;
      background: rgba(255,215,0,0.2);
    }

    /* Divider with call score */
    .h-divider {
      width: 1px;
      height: 100%;
      background: rgba(255,255,255,0.1);
      position: relative;
      flex-shrink: 0;
    }
    .call-pill {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      background: #000;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0 0 16px 16px;
      padding: 10px 28px;
      font-size: 66px; font-weight: 800;
      color: var(--gold);
      white-space: nowrap;
      z-index: 20;
    }

    /* Mode tag */
    .mode-tag {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
      letter-spacing: 0.5px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.15);
      border-bottom: none;
      border-radius: 16px 16px 0 0;
      padding: 10px 28px;
    }

    /* Win overlay */
    #winOverlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 40px;
      z-index: 10;
    }
    #winOverlay.show { display: flex; }
    .win-trophy {
      font-size: 80vh;
      line-height: 1;
      flex-shrink: 0;
    }
    .win-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      min-width: 0;
    }
    .win-name  {
      font-size: clamp(48px, 11vw, 150px);
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .win-score {
      font-size: clamp(32px, 7vw, 96px);
      font-weight: 800;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="screen">

  <!-- Wake button -->
  <button id="wakeBtn" onclick="activateNoSleep()" style="
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #ffd700; color: #0d1b2a;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 900;
    padding: 12px 28px; cursor: pointer;
    z-index: 100; white-space: nowrap;
  ">🔆 Keep Screen On</button>

  <!-- Waiting -->
  <div id="waiting">
    <div class="wait-icon">🏓</div>
    <div class="wait-text">Waiting for game<br>on Watch…</div>
  </div>

  <!-- Scoreboard -->
  <div id="scoreboard">
    <div class="team-panel" id="panelA">
      <div class="score-row">
        <div class="t-score" id="scoreA" style="color: var(--a)">0</div>
        <div class="serve-boxes">
          <div class="serve-box" id="sbA1">1</div>
          <div class="serve-box" id="sbA2">2</div>
        </div>
      </div>
    </div>

    <div class="h-divider">
      <div class="call-pill" id="callScore">0 • 0</div>
    </div>

    <div class="team-panel" id="panelB">
      <div class="score-row">
        <div class="serve-boxes">
          <div class="serve-box" id="sbB1">1</div>
          <div class="serve-box" id="sbB2">2</div>
        </div>
        <div class="t-score" id="scoreB" style="color: var(--b)">0</div>
      </div>
    </div>

    <div class="mode-tag" id="modeTag"></div>
  </div>
</div>

<!-- Win overlay -->
<div id="winOverlay">
  <div class="win-trophy">🏆</div>
  <div class="win-info">
    <div class="win-name" id="winName"></div>
    <div class="win-score" id="winScore"></div>
  </div>
</div>

<script>
const noSleep = new NoSleep();
let noSleepActive = false;

function activateNoSleep() {
  if (noSleepActive) return;
  noSleep.enable();
  noSleepActive = true;
  const btn = document.getElementById('wakeBtn');
  if (btn) btn.style.display = 'none';
}

firebase.initializeApp({
  apiKey: "AIzaSyAUJ7ThK34M4f_JEv7ymdLvFMtGmE3_sDs",
  authDomain: "pickleball-score-97b6a.firebaseapp.com",
  databaseURL: "https://pickleball-score-97b6a-default-rtdb.firebaseio.com",
  projectId: "pickleball-score-97b6a",
  storageBucket: "pickleball-score-97b6a.firebasestorage.app",
  messagingSenderId: "848083702434",
  appId: "1:848083702434:web:6093022a15f88dd7e9bdfb"
});

const db = firebase.database();
const colors = { A: '#1976D2', B: '#D32F2F' };

// ── Auto-fit score text so it never overflows its half of the screen ──
// Measures the space actually available next to the serve-boxes column
// and shrinks the font-size until the number fits, no matter how many
// digits it has (works for 1, 2 or 3-digit scores).
function fitScoreText(el) {
  const row   = el.parentElement;          // .score-row
  const panel = row.parentElement;         // .team-panel
  const serveBoxes = row.querySelector('.serve-boxes');
  const gap = 16; // matches .score-row gap
  const padding = 12; // small safety buffer so glyphs never touch the edge
  const cardShift = 40; // .serve-boxes is nudged 40px toward the divider, reserve that space too

  const serveBoxesVisible = serveBoxes && getComputedStyle(serveBoxes).display !== 'none';
  const reserved = serveBoxesVisible ? (serveBoxes.offsetWidth + gap + cardShift) : 0;
  const available = panel.clientWidth - reserved - padding;
  if (available <= 0) return;

  // Scores run 30% bigger in both modes — but never wider than `available`,
  // so the fixed 50/50 split from before is never broken.
  const boost = 1.3;

  // Start from the panel height/width so short scores still look big,
  // then shrink until the rendered text fits inside `available`.
  let fontSize = Math.min(available * 1.5 * boost, panel.clientHeight * 0.85 * boost, 320 * boost);
  el.style.fontSize = fontSize + 'px';

  let guard = 0;
  while (el.scrollWidth > available && fontSize > 24 && guard < 80) {
    fontSize -= 4;
    el.style.fontSize = fontSize + 'px';
    guard++;
  }
}

function fitAllScores() {
  fitScoreText(document.getElementById('scoreA'));
  fitScoreText(document.getElementById('scoreB'));
}

window.addEventListener('resize', fitAllScores);
window.addEventListener('orientationchange', () => setTimeout(fitAllScores, 150));

db.ref('game').on('value', snap => {
  const g = snap.val();

  if (!g || !g.active) {
    document.getElementById('waiting').style.display   = 'flex';
    document.getElementById('scoreboard').style.display = 'none';
    document.getElementById('winOverlay').classList.remove('show');
    return;
  }

  document.getElementById('waiting').style.display    = 'none';
  document.getElementById('scoreboard').style.display = 'flex';
  document.getElementById('scoreboard').classList.toggle('rally', g.mode !== 'regular');

  const isA = g.serving === 'A';

  document.getElementById('scoreA').textContent = g.scoreA;
  document.getElementById('scoreB').textContent = g.scoreB;

  document.getElementById('panelA').classList.toggle('serving', isA);
  document.getElementById('panelB').classList.toggle('serving', !isA);

  const showNum = g.mode === 'regular' && g.type === 'doubles';
  ['sbA1','sbA2','sbB1','sbB2'].forEach(id => document.getElementById(id).classList.remove('active'));
  if (showNum) {
    document.getElementById(`sb${isA ? 'A' : 'B'}${g.serverNum}`).classList.add('active');
  }

  const sA = isA ? g.scoreA : g.scoreB;
  const sB = isA ? g.scoreB : g.scoreA;
  document.getElementById('callScore').textContent =
    showNum ? `${sA} • ${sB} • ${g.serverNum}` : `${g.scoreA} • ${g.scoreB}`;

  document.getElementById('modeTag').textContent =
    `${g.mode === 'regular' ? 'REGULAR' : 'RALLY'} · ${g.winPoints} PTS`;

  // Win
  if (g.over) {
    const aWon = g.scoreA >= g.scoreB;
    const name  = aWon ? 'TEAM BLUE' : 'TEAM RED';
    const color = aWon ? colors.A : colors.B;
    document.getElementById('winName').textContent  = name;
    document.getElementById('winName').style.color  = color;
    document.getElementById('winScore').textContent =
      `${aWon ? g.scoreA : g.scoreB} × ${aWon ? g.scoreB : g.scoreA}`;
    document.getElementById('winOverlay').classList.add('show');
  } else {
    document.getElementById('winOverlay').classList.remove('show');
  }

  // Re-fit after the DOM has the new score painted
  requestAnimationFrame(fitAllScores);
});

function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
</script>
</body>
</html>
